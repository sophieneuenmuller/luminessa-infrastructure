services:
  n8n:
    image: n8nio/n8n:2.19.2
    container_name: n8n
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.luminessa.net
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.luminessa.net/
      - GENERIC_TIMEZONE=${TIMEZONE:-Europe/Madrid}
      # Database Connection
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_NAME}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_USER}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD}
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      # - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_USER_FOLDER=/home/node
      - HOME=/home/node
      # Runners
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/.n8n;/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    volumes:
      - /opt/n8n/config:/home/node
      - /opt/n8n/data:/data
    networks:
      - proxy
      - database
      - n8n

  n8n-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: n8n_runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - PYTHON_PATH=/usr/bin/python3
      - N8N_RUNNERS_TASK_TIMEOUT=60
    volumes:
      - /opt/n8n/data:/data
    depends_on:
      - n8n
    networks:
      - n8n

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
    networks:
      - n8n

  # Corrector ortográfico técnico, sin IA (Puerto 8010)
  languagetool:
    image: erikvl87/languagetool:6.7-dockerupdate-4
    container_name: languagetool_server
    restart: unless-stopped
    environment:
      # Configuraciones para optimizar el uso de RAM
      - langtool_min_mem=512m
      - langtool_max_mem=1g
    networks:
      - n8n

  ollama:
    image: ollama/ollama:0.22.1
    container_name: ollama
    restart: unless-stopped
    volumes:
      - /opt/n8n/ollama_data:/root/.ollama
    networks:
      - n8n

networks:
  proxy:
    external: true
  database:
    external: true
  n8n:
    external: false
