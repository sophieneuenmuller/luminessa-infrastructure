services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    environment:
      # Public hostname of the VPN server
      - WG_HOST=${WG_HOST:-vpn.luminessa.net}
      # Password for the Web UI (Port 51821)
      - PASSWORD=${PASSWORD:-changeme}
      # Port for the Wireguard tunnel (UDP)
      - WG_PORT=${WG_PORT:-51820}
      # Experimental AmneziaWG support
      - EXPERIMENTAL_AWG=true
    volumes:
      - ./data:/etc/wireguard
    ports:
      - "51820:51820/udp"
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - proxy

networks:
  proxy:
    external: true
