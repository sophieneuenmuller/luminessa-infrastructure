services:
  engram-cloud:
    image: ghcr.io/gentleman-programming/engram-cloud:latest
    container_name: engram-cloud
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    env_file: .env
    environment:
      - HOME=/home/engram
    networks:
      - proxy
      - database
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    volumes:
      - /opt/engram-cloud:/home/engram
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true
  database:
    external: true
