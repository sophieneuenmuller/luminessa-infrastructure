services:
  grimmory:
    image: ghcr.io/grimmory-tools/grimmory:latest
    container_name: grimmory
    restart: unless-stopped
    depends_on:
      grimmory-db:
        condition: service_healthy
    networks:
      - grimmory-internal
      - proxy
    environment:
      - DATABASE_URL=jdbc:mariadb://grimmory-db:3306/${MYSQL_DATABASE}?user=${MYSQL_USER}&password=${MYSQL_PASSWORD}
      - GRIMMORY_PORT=${GRIMMORY_PORT:-6060}
      - GRIMMORY_EXTERNAL_URL=${GRIMMORY_EXTERNAL_URL:-https://libros.luminessa.net}
      - TZ=${TZ:-Europe/Madrid}
      # Ajuste de memoria para Java (JVM)
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -XX:+UseCompactObjectHeaders -XX:+UseStringDeduplication -XX:MaxRAMPercentage=60.0 -XX:+ExitOnOutOfMemoryError
    volumes:
      - ./config:/config
      - ./library:/library
      - ./import:/import
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G

  grimmory-db:
    image: mariadb:11
    container_name: grimmory-db
    restart: unless-stopped
    command: --performance-schema=OFF
    networks:
      - grimmory-internal
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s # Para primer inicio, darle un periodo de inicio de 60s, que permita a MariaDB inicializar como es debido. Se puede bajar a 15s a posteriori

networks:
  grimmory-internal:
    internal: true
  proxy:
    external: true
