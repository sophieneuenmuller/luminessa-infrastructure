services:
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data:/data
      - ./config:/config
      - /var/www/luminessa-blog:/var/www/luminessa-blog:ro
      - /var/www/luminessa-landing:/var/www/luminessa-landing:ro
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - proxy

networks:
  proxy:
    external: true
